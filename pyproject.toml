[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "postgresql-portable"
version = "0.1.0"
description = "Manage portable PostgreSQL (ZIP binaries on Windows)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0,<2",
    "pytest>=8.0,<9",
]

[project.scripts]
postgresql-portable = "postgresql_portable.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
